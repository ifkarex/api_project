name: api

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: api-app:latest
    pull_policy: never
    container_name: api-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      - APP_ENV=local
      - CONTAINER_ROLE=app
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - api-net

  webserver:
    image: nginx:1.27-alpine
    container_name: api-webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - app
    networks:
      - api-net

  mariadb:
    image: mariadb:11
    container_name: api-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: api
      MARIADB_USER: api
      MARIADB_PASSWORD: api
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - api-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - api-net

  redis:
    image: redis:7-alpine
    container_name: api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - api-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - api-net

networks:
  api-net:
    driver: bridge

volumes:
  api-mariadb-data:
  api-redis-data: 